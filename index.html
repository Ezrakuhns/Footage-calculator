<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Footage Calculator</title>
<style>
:root {
    --bg-color: #121212;
    --card-bg: rgba(30, 30, 30, 0.75);
    --text-color: #f5f5f5;
    --accent: #4caf50;
    --muted: #aaa;
    --highlight-bg: rgba(38, 50, 56, 0.7);
    --note-color: #ccc;
    --blur: 10px;
}

body.light-mode {
    --bg-color: #f4f4f4;
    --card-bg: rgba(255, 255, 255, 0.8);
    --text-color: #222;
    --accent: #2e7d32;
    --muted: #555;
    --highlight-bg: rgba(226, 240, 217, 0.8);
    --note-color: #555;
    --blur: 6px;
}

body {
    font-family: Arial, sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    padding: 25px;
    min-height: 100vh;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    background-image: radial-gradient(circle at top left, #1a1a1a, #0d0d0d);
}

h2 {
    text-align: center;
    color: var(--accent);
    margin-bottom: 20px;
}

.top-buttons {
    position: absolute;
    top: 15px;
    right: 15px;
    display: flex;
    gap: 6px;
    z-index: 10;
}

.top-btn {
    background: var(--card-bg);
    color: var(--text-color);
    border: 1px solid var(--muted);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.3s, color 0.3s, border 0.3s;
    backdrop-filter: blur(var(--blur));
}
.top-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
}

.tab-buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.tab-buttons button {
    padding: 6px 12px;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid var(--muted);
    background: var(--card-bg);
    color: var(--text-color);
    transition: background 0.3s, color 0.3s, border 0.3s;
}
.tab-buttons button.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
}

.calculator {
    background: var(--card-bg);
    backdrop-filter: blur(var(--blur));
    padding: 18px 20px;
    max-width: 350px;
    width: 100%;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
    display: none;
    flex-direction: column;
    align-items: stretch;
}

.calculator.active {
    display: flex;
}

.input-row {
    display: flex;
    align-items: center;
    margin-top: 10px;
    gap: 8px;
}

label {
    width: 100px;
    font-weight: bold;
    color: var(--text-color);
}

input, select {
    flex: 1;
    padding: 5px;
    font-size: 15px;
    border: 1px solid #333;
    border-radius: 5px;
    background: rgba(42, 42, 42, 0.8);
    color: var(--text-color);
    transition: border 0.2s, background 0.2s;
}

body.light-mode input, body.light-mode select {
    background: rgba(255, 255, 255, 0.9);
    border-color: #ccc;
    color: #222;
}

input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    background: rgba(60, 60, 60, 0.9);
}
body.light-mode input:focus, body.light-mode select:focus {
    background: #f0f0f0;
}

.result {
    margin-top: 15px;
    padding: 10px;
    background: var(--highlight-bg);
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 0 8px rgba(0,0,0,0.4);
    font-size: 14px;
}

.result p {
    margin: 5px 0;
}

.total {
    font-size: 18px;
    font-weight: bold;
    color: var(--accent);
}

.note {
    font-size: 12px;
    font-style: italic;
    color: var(--note-color);
}

@media (max-width: 600px) {
    body { padding: 10px; }
    h2 { font-size: 18px; margin-bottom: 10px; }
    .calculator { padding: 12px 14px; width: 92%; }
    label { width: 85px; font-size: 14px; }
    input, select { font-size: 14px; padding: 4px; }
    .result { padding: 8px; font-size: 13px; }
    .total { font-size: 16px; }
    .top-buttons { top: 8px; right: 8px; gap: 5px; }
    .top-btn { font-size: 11px; padding: 3px 6px; }
}
</style>
</head>
<body>

<div class="top-buttons">
    <button class="top-btn" id="themeToggle">☀️ Light Mode</button>
</div>

<h2>Footage Calculator</h2>

<div class="tab-buttons">
    <button class="active" data-tab="wall">Wall/Ceiling</button>
    <button data-tab="gable">Gable</button>
</div>

<!-- Wall/Ceiling Calculator -->
<div class="calculator active" id="wall">
    <div class="input-row">
        <label for="wallHeightFeet">Height:</label>
        <input type="number" id="wallHeightFeet" value="0" min="0"> ft
        <input type="number" id="wallHeightInches" value="0" min="0" max="11"> in
    </div>
    <div class="input-row">
        <label for="wallLength">Length (ft):</label>
        <input type="number" id="wallLength" value="0" min="0">
    </div>
    <div class="input-row">
        <label for="wallBoard">Board Type:</label>
        <select id="wallBoard">
            <option value="1">1x6 T&G</option>
            <option value="2">1x8 T&G</option>
            <option value="3">1x10 T&G</option>
            <option value="4">1x12 T&G</option>
            <option value="5">1x6 Shiplap</option>
            <option value="6">1x8 Shiplap</option>
            <option value="7">1x10 Shiplap</option>
            <option value="8">1x12 Shiplap</option>
            <option value="9">2x6 Log Siding</option>
            <option value="10">2x8 Log Siding</option>
        </select>
    </div>
    <div class="result">
        <p class="total">Linear Feet: <span id="wallLinearFeet">0</span></p>
        <p>Standard Grade Price: <span id="wallStandardPrice">$0.00</span></p>
        <p>Cabin Grade Price: <span id="wallCabinPrice">$0.00</span></p>
        <p class="note">Recommended to round up for waste</p>
        <p class="note">Prices Include Tax</p>
    </div>
</div>

<!-- Gable Calculator -->
<div class="calculator" id="gable">
    <div class="input-row">
        <label for="gableHeightFeet">Gable Height:</label>
        <input type="number" id="gableHeightFeet" value="0" min="0"> ft
        <input type="number" id="gableHeightInches" value="0" min="0" max="11"> in
    </div>
    <div class="input-row">
        <label for="gableWidth">Base Width (ft):</label>
        <input type="number" id="gableWidth" value="0" min="0">
    </div>
    <div class="input-row">
        <label for="gableBoard">Board Type:</label>
        <select id="gableBoard">
            <option value="1">1x6 T&G</option>
            <option value="2">1x8 T&G</option>
            <option value="3">1x10 T&G</option>
            <option value="4">1x12 T&G</option>
            <option value="5">1x6 Shiplap</option>
            <option value="6">1x8 Shiplap</option>
            <option value="7">1x10 Shiplap</option>
            <option value="8">1x12 Shiplap</option>
            <option value="9">2x6 Log Siding</option>
            <option value="10">2x8 Log Siding</option>
        </select>
    </div>
    <div class="result">
        <p class="total">Linear Feet: <span id="gableLinearFeet">0</span></p>
        <p>Standard Grade Price: <span id="gableStandardPrice">$0.00</span></p>
        <p>Cabin Grade Price: <span id="gableCabinPrice">$0.00</span></p>
        <p class="note">Recommended to round up for waste</p>
        <p class="note">Prices Include Tax</p>
    </div>
</div>

<script>
const boardData = {
    1: { width: 5.125, priceStandard: 0.80, priceCabin: 0.45 },
    2: { width: 7, priceStandard: 1.06, priceCabin: 0.60 },
    3: { width: 8.875, priceStandard: 1.32, priceCabin: 0.75 },
    4: { width: 10.875, priceStandard: 1.60, priceCabin: 0.90 },
    5: { width: 5, priceStandard: 0.80, priceCabin: 0.45 },
    6: { width: 6.75, priceStandard: 1.06, priceCabin: 0.60 },
    7: { width: 8.875, priceStandard: 1.34, priceCabin: 0.75 },
    8: { width: 10.75, priceStandard: 1.80, priceCabin: 0.90 },
    9: { width: 5, priceStandard: 1.90, priceCabin: 1.17 },
    10:{ width: 7, priceStandard: 2.45, priceCabin: 1.55 },
};

// Wall calculator
function calculateWall() {
    const feet = parseFloat(document.getElementById('wallHeightFeet').value) || 0;
    const inches = parseFloat(document.getElementById('wallHeightInches').value) || 0;
    const height = feet + inches / 12;
    const length = parseFloat(document.getElementById('wallLength').value) || 0;
    const boardKey = parseInt(document.getElementById('wallBoard').value,10);
    const board = boardData[boardKey];

    let totalHeightIn = height * 12;
    let boardsPerRow = Math.ceil(totalHeightIn / board.width);
    let linearFeet = Math.ceil(boardsPerRow * length);
    if (linearFeet % 2 !== 0) linearFeet++;

    document.getElementById('wallLinearFeet').textContent = linearFeet.toLocaleString();
    document.getElementById('wallStandardPrice').textContent = `$${(linearFeet*board.priceStandard*1.06).toFixed(2)}`;
    document.getElementById('wallCabinPrice').textContent = `$${(linearFeet*board.priceCabin*1.06).toFixed(2)}`;
}

// Gable calculator
function calculateGable() {
    const feet = parseFloat(document.getElementById('gableHeightFeet').value) || 0;
    const inches = parseFloat(document.getElementById('gableHeightInches').value) || 0;
    const height = feet + inches / 12;
    const width = parseFloat(document.getElementById('gableWidth').value) || 0;
    const boardKey = parseInt(document.getElementById('gableBoard').value,10);
    const board = boardData[boardKey];

    const area = 0.75 * height * width;
    const coverage = board.width / 12;
    let linearFeet = Math.ceil(area / coverage);
    if (linearFeet % 2 !== 0) linearFeet++;

    document.getElementById('gableLinearFeet').textContent = linearFeet.toLocaleString();
    document.getElementById('gableStandardPrice').textContent = `$${(linearFeet*board.priceStandard*1.06).toFixed(2)}`;
    document.getElementById('gableCabinPrice').textContent = `$${(linearFeet*board.priceCabin*1.06).toFixed(2)}`;
}

// Event listeners for calculation
['wallHeightFeet','wallHeightInches','wallLength','wallBoard'].forEach(id =>
    document.getElementById(id).addEventListener('input', calculateWall));
['gableHeightFeet','gableHeightInches','gableWidth','gableBoard'].forEach(id =>
    document.getElementById(id).addEventListener('input', calculateGable));

calculateWall();
calculateGable();

// Theme toggle
const themeToggle = document.getElementById('themeToggle');
function applyTheme(light) {
    document.body.classList.toggle('light-mode', light);
    themeToggle.textContent = light ? '🌙 Dark Mode' : '☀️ Light Mode';
    localStorage.setItem('theme', light ? 'light' : 'dark');
}
themeToggle.addEventListener('click', () => applyTheme(!document.body.classList.contains('light-mode')));
if (localStorage.getItem('theme') === 'light') applyTheme(true);

// Tab switch
document.querySelectorAll('.tab-buttons button').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-buttons button').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.calculator').forEach(calc => calc.classList.remove('active'));
        document.getElementById(btn.dataset.tab).classList.add('active');
    });
});

// Auto erase 0 on focus and restore 0 on blur if empty
document.querySelectorAll('input[type="number"]').forEach(input => {
    input.addEventListener('focus', () => {
        if (input.value === '0') input.value = '';
    });
    input.addEventListener('blur', () => {
        if (input.value === '') input.value = '0';
    });
});

// Auto zoom out on mobile after input blur
function resetZoom() {
    const viewport = document.querySelector('meta[name=viewport]');
    if (!viewport) return;
    viewport.content = "width=device-width, initial-scale=1, maximum-scale=1";
    setTimeout(() => {
        viewport.content = "width=device-width, initial-scale=1, maximum-scale=5";
    }, 300);
}
document.querySelectorAll('input[type="number"]').forEach(input => {
    input.addEventListener('blur', resetZoom);
});
</script>
</body>
</html>
