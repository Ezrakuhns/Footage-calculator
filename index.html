<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Footage Calculator</title>

<style>
    :root {
        --bg-color: #121212;
        --card-bg: #1e1e1e;
        --text-color: #f5f5f5;
        --accent: #4caf50;
        --muted: #aaa;
        --highlight-bg: #263238;
        --note-color: #ccc;
    }

    body.light-mode {
        --bg-color: #f4f4f4;
        --card-bg: #ffffff;
        --text-color: #222;
        --accent: #2e7d32;
        --muted: #555;
        --highlight-bg: #e2f0d9;
        --note-color: #555;
    }

    body {
        font-family: Arial, sans-serif;
        background: var(--bg-color);
        color: var(--text-color);
        padding: 25px;
        transition: all 0.3s ease;
        min-height: 100vh;
    }

    h2 {
        text-align: center;
        color: var(--accent);
        margin-bottom: 25px;
    }

    /* 🌗 Theme Toggle Button */
    .theme-toggle {
        position: absolute;
        top: 18px;
        right: 18px;
        background: var(--card-bg);
        color: var(--text-color);
        border: 1px solid var(--muted);
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.3s, color 0.3s, border 0.3s;
        z-index: 10;
    }
    .theme-toggle:hover {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
    }

    .calculator {
        background: var(--card-bg);
        padding: 20px 25px;
        max-width: 430px;
        margin: 55px auto 0;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
    }

    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
        color: var(--text-color);
    }

    .input-group {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 5px;
    }

    input {
        width: 75px;
        padding: 6px;
        font-size: 16px;
        border: 1px solid #333;
        border-radius: 5px;
        background: #2a2a2a;
        color: var(--text-color);
        transition: border 0.2s, background 0.2s;
    }

    body.light-mode input {
        background: #fff;
        border-color: #ccc;
        color: #222;
    }

    input:focus {
        outline: none;
        border-color: var(--accent);
        background: #333;
    }
    body.light-mode input:focus {
        background: #f0f0f0;
    }

    select {
        margin-top: 10px;
        padding: 8px;
        font-size: 16px;
        width: 100%;
        border-radius: 5px;
        border: 1px solid #333;
        background: #2a2a2a;
        color: var(--text-color);
        transition: border 0.2s, background 0.2s;
    }

    body.light-mode select {
        background: #fff;
        border-color: #ccc;
        color: #222;
    }

    select:focus {
        outline: none;
        border-color: var(--accent);
        background: #333;
    }
    body.light-mode select:focus {
        background: #f0f0f0;
    }

    .result {
        margin-top: 22px;
        padding: 14px;
        background: var(--highlight-bg);
        border-radius: 8px;
        text-align: center;
        box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    .result p {
        margin: 8px 0;
        font-size: 17px;
    }

    .total {
        font-size: 21px;
        font-weight: bold;
        color: var(--accent);
    }

    .note {
        margin-top: 12px;
        font-size: 13px;
        font-style: italic;
        color: var(--note-color);
    }

    /* ✅ Slim, Centered Mobile Layout */
    @media (max-width: 600px) {
        body {
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        h2 {
            font-size: 20px;
            margin: 10px 0;
        }
        .calculator {
            padding: 14px 16px;
            width: 92%;
            margin: 0 auto;
        }
        label {
            margin-top: 10px;
            font-size: 14px;
        }
        .input-group {
            flex-direction: column;
            gap: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 5px;
            font-size: 15px;
        }
        select {
            font-size: 15px;
            padding: 6px;
        }
        .result {
            padding: 10px;
        }
        .result p {
            font-size: 15px;
            margin: 6px 0;
        }
        .total {
            font-size: 18px;
        }
        .theme-toggle {
            top: 10px;
            right: 10px;
            font-size: 12px;
            padding: 4px 7px;
        }
    }
</style>
</head>
<body>

<!-- 🌗 Theme Toggle Button -->
<button class="theme-toggle" id="themeToggle">☀️ Light Mode</button>

<h2>Footage Calculator</h2>

<div class="calculator">
    <div>
        <label>Height:</label>
        <div class="input-group">
            <input type="number" id="heightFt" value="0" min="0" placeholder="ft"> ft
            <input type="number" id="heightIn" value="0" min="0" placeholder="in"> in
        </div>
    </div>

    <div>
        <label>Length:</label>
        <div class="input-group">
            <input type="number" id="lengthFt" value="0" min="0" placeholder="ft"> ft
            <input type="number" id="lengthIn" value="0" min="0" placeholder="in"> in
        </div>
    </div>

    <div>
        <label>Board Type:</label>
        <select id="boardSelect">
            <option value="1">1x6 T&G</option>
            <option value="2">1x8 T&G</option>
            <option value="3">1x10 T&G</option>
            <option value="4">1x12 T&G</option>
            <option value="5">1x6 Shiplap</option>
            <option value="6">1x8 Shiplap</option>
            <option value="7">1x10 Shiplap</option>
            <option value="8">1x12 Shiplap</option>
        </select>
    </div>

    <div class="result">
        <p class="total">Linear Feet: <span id="linearFeet">0</span></p>
        <p>Standard Grade Price: <span id="standardPrice">$0.00</span></p>
        <p>Cabin Grade Price: <span id="cabinPrice">$0.00</span></p>
        <p class="note">Recommended to round up for waste</p>
        <p class="note">Prices Include Tax</p>
    </div>
</div>

<script>
const boardData = {
    1: { width: 5.125, priceStandard: 0.80, priceCabin: 0.45 },
    2: { width: 7, priceStandard: 1.06, priceCabin: 0.60 },
    3: { width: 8.875, priceStandard: 1.32, priceCabin: 0.75 },
    4: { width: 10.875, priceStandard: 1.60, priceCabin: 0.90 },
    5: { width: 5, priceStandard: 0.80, priceCabin: 0.45 },
    6: { width: 6.75, priceStandard: 1.06, priceCabin: 0.60 },
    7: { width: 8.875, priceStandard: 1.34, priceCabin: 0.75 },
    8: { width: 10.75, priceStandard: 1.80, priceCabin: 0.90 },
};

function calculate() {
    const heightFt = parseFloat(document.getElementById('heightFt').value) || 0;
    const heightIn = parseFloat(document.getElementById('heightIn').value) || 0;
    const lengthFt = parseFloat(document.getElementById('lengthFt').value) || 0;
    const lengthIn = parseFloat(document.getElementById('lengthIn').value) || 0;
    const boardKey = document.getElementById('boardSelect').value;

    const totalHeightIn = (heightFt * 12) + heightIn;
    const totalLengthFt = lengthFt + (lengthIn / 12);
    const board = boardData[boardKey];

    let boardsPerRow = Math.ceil(totalHeightIn / board.width);
    let linearFeet = Math.ceil(boardsPerRow * totalLengthFt);
    if (linearFeet % 2 !== 0) linearFeet++;

    const standardPrice = (linearFeet * board.priceStandard * 1.06).toFixed(2);
    const cabinPrice = (linearFeet * board.priceCabin * 1.06).toFixed(2);

    document.getElementById('linearFeet').textContent = linearFeet;
    document.getElementById('standardPrice').textContent = `$${standardPrice}`;
    document.getElementById('cabinPrice').textContent = `$${cabinPrice}`;
}

document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', calculate));
document.querySelectorAll('input[type="number"]').forEach(input => {
    input.addEventListener('focus', () => { if (input.value === "0") input.value = ""; });
    input.addEventListener('blur', () => { if (input.value === "") input.value = "0"; calculate(); });
});

calculate();

/* 🌗 Theme Toggle Logic */
const themeToggle = document.getElementById('themeToggle');
function applyTheme(light) {
    document.body.classList.toggle('light-mode', light);
    themeToggle.textContent = light ? '🌙 Dark Mode' : '☀️ Light Mode';
    localStorage.setItem('theme', light ? 'light' : 'dark');
}
themeToggle.addEventListener('click', () => applyTheme(!document.body.classList.contains('light-mode')));
if (localStorage.getItem('theme') === 'light') applyTheme(true);
</script>

</body>
</html>
